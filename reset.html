<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - IIA Fest</title>

    <!-- SweetAlert2 & Firebase Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* CORE VARIABLES (Matched with your main app) */
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --visitor-color: #0284c7; 
            --admin-color: #7c3aed;   
            --staff-color: #059669;
            --danger: #ef4444;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: transparent; margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: var(--text-main); position: relative; overflow-x: hidden;
        }

        /* HACKER BACKGROUND */
        #hacker-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: linear-gradient(135deg, #e2e8f0, #f8fafc); }
        .light-source { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15; z-index: -2; transition: all 1s ease; }
        .light-1 { width: 400px; height: 400px; background: var(--visitor-color); top: -10%; left: -10%; animation: driftLight 15s ease infinite alternate; }
        .light-2 { width: 500px; height: 500px; background: var(--admin-color); bottom: -15%; right: -10%; animation: driftLight 20s ease infinite alternate-reverse; }

        @keyframes driftLight {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 80px) scale(1.2); }
            100% { transform: translate(-40px, -60px) scale(0.9); }
        }

        .data-stream {
            position: absolute; bottom: -100px; font-family: monospace; font-size: 16px; line-height: 1.2;
            color: rgba(0,0,0,0.1); writing-mode: vertical-rl; text-orientation: upright;
            white-space: nowrap; animation: streamUp var(--duration) linear infinite;
            animation-delay: var(--delay); opacity: 0;
        }
        @keyframes streamUp {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-150vh); opacity: 0; }
        }

        /* UI PANEL */
        .container { width: 100%; max-width: 400px; position: relative; z-index: 2; }
        .panel { background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); backdrop-filter: blur(16px); border: 1px solid var(--border-color); padding: 30px 20px; text-align: center; }
        
        h2 { color: var(--visitor-color); margin-top: 0; margin-bottom: 5px; font-size: 1.8rem; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

        input { width: 100%; padding: 14px; margin: 8px 0 16px 0; border: 1px solid var(--input-border); border-radius: 12px; box-sizing: border-box; font-size: 1rem; background-color: var(--input-bg); color: var(--text-main); transition: all 0.2s; }
        input:focus { outline: none; border-color: var(--visitor-color); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        
        /* Eye Button Alignment Fix */
        .password-container { position: relative; width: 100%; margin: 8px 0 16px 0; }
        .password-container input { margin: 0; padding-right: 50px; }
        .eye-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-muted); padding: 0; width: auto; }

        button { background-color: var(--visitor-color); color: white; border: none; padding: 14px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }

        .status-msg { margin-top: 15px; font-weight: bold; padding: 12px; border-radius: 10px; text-align: center; font-size: 0.95rem; }
        .msg-error { background: #fee2e2; color: #9f1239; border: 1px solid #fda4af; }
        .hidden { display: none !important; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="hacker-bg">
    <div class="light-source light-1"></div><div class="light-source light-2"></div>
    <div class="data-stream" style="left: 15%; --duration: 18s; --delay: 0s;">01101001 01100001 01101101 01100100</div>
    <div class="data-stream" style="left: 80%; --duration: 25s; --delay: 2s;">11001100 01101001 01101001 01100001</div>
</div>

<div class="container">
    <div class="panel">
        <h2>Reset Password</h2>
        <p id="userEmailDisplay">Verifying secure link...</p>
        
        <form id="formResetPass">
            <div class="password-container">
                <input type="password" id="newPass" placeholder="Enter New Password" required>
                <button type="button" class="eye-btn" onclick="togglePassword('newPass', this)">👁️</button>
            </div>
            <div class="password-container">
                <input type="password" id="confirmPass" placeholder="Confirm New Password" required>
                <button type="button" class="eye-btn" onclick="togglePassword('confirmPass', this)">👁️</button>
            </div>
            
            <button type="submit" id="resetBtn">Update Password</button>
            <div id="resetError" class="status-msg msg-error hidden"></div>
        </form>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvtM_LmkN4oXlQ7_wojG8CunUuw6lbt7Y",
      authDomain: "iia-fest.firebaseapp.com",
      projectId: "iia-fest",
      storageBucket: "iia-fest.firebasestorage.app",
      messagingSenderId: "111712260847",
      appId: "1:111712260847:web:667572c9309a011b02811a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        if (input.type === "password") { input.type = "text"; btn.innerText = "🙈"; } 
        else { input.type = "password"; btn.innerText = "👁️"; }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        if (!actionCode) {
            Swal.fire({ icon: 'error', title: 'Invalid Link', text: 'The password reset link is invalid or has expired.', allowOutsideClick: false });
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('userEmailDisplay').innerText = "Access Denied.";
            return;
        }

        auth.verifyPasswordResetCode(actionCode).then((email) => {
            document.getElementById('userEmailDisplay').innerText = "For: " + email;
        }).catch((error) => {
            Swal.fire('Error', 'Invalid or expired link. Please request a new one from the app.', 'error');
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('userEmailDisplay').innerText = "Link Expired.";
        });

        document.getElementById('formResetPass').addEventListener('submit', (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const errBox = document.getElementById('resetError');

            if(p1.length < 6) {
                errBox.innerText = "Password must be at least 6 characters.";
                errBox.classList.remove('hidden'); return;
            }
            if(p1 !== p2) {
                errBox.innerText = "Passwords do not match.";
                errBox.classList.remove('hidden'); return;
            }
            
            errBox.classList.add('hidden');
            const btn = document.getElementById('resetBtn');
            btn.innerHTML = 'Processing... <div class="spinner"></div>';
            btn.disabled = true;

            auth.confirmPasswordReset(actionCode, p1).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Password Updated!',
                    text: 'Your password has been changed successfully. You can now log in.',
                    confirmButtonColor: '#0284c7',
                    confirmButtonText: 'Go to Login'
                }).then(() => {
                    window.location.href = 'index.html'; 
                });
            }).catch((error) => {
                errBox.innerText = error.message;
                errBox.classList.remove('hidden');
                btn.innerText = 'Update Password';
                btn.disabled = false;
            });
        });
    });
</script>
</body>
</html>
